<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pad map icon set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{ px }}; height: {{ px }}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ isWellhead }}" hint-placeholder-val="{{ true }}"><svg role="img" aria-label="wellhead" width="100%" height="100%" viewBox="0 0 36 36" style="fill: none; stroke: #E2662B; stroke-width: 2.4; stroke-linecap: round"><path d="M 18 33 L 18 6 M 9 12 L 27 12 M 10 20 L 26 20 M 12 27 L 24 27"></path><circle cx="18" cy="12" r="3" fill="#E2662B" stroke="none"></circle><circle cx="18" cy="20" r="3" fill="#E2662B" stroke="none"></circle></svg></sc-if>
<sc-if value="{{ isBattery }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="tank battery" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><rect x="4" y="8" width="32" height="24" rx="3"></rect><circle cx="12" cy="15" r="3.5"></circle><circle cx="20" cy="15" r="3.5"></circle><circle cx="28" cy="15" r="3.5"></circle><circle cx="12" cy="25" r="3.5"></circle><circle cx="20" cy="25" r="3.5"></circle><circle cx="28" cy="25" r="3.5"></circle></svg></sc-if>
<sc-if value="{{ isSeparator }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="separator" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><rect x="4" y="13" width="32" height="14" rx="7"></rect><path d="M 12 13 L 12 27 M 28 13 L 28 27 M 20 8 L 20 13 M 20 27 L 20 32"></path></svg></sc-if>
<sc-if value="{{ isEsp }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="ESP drive" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #B07A2E; stroke-width: 2"><rect x="9" y="5" width="22" height="30" rx="2"></rect><path d="M 22 9 L 16 21 L 21 21 L 18 31 L 25 17 L 20 17 Z" fill="#D9A25E" stroke="none"></path></svg></sc-if>
<sc-if value="{{ isLact }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="LACT, oil sale" width="100%" height="100%" viewBox="0 0 40 40"><path d="M 14 6 C 14 6 5 17 5 23 a 9 9 0 0 0 18 0 c 0 -6 -9 -17 -9 -17 Z" fill="#5E7A3A"></path><text x="30" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#5E7A3A" font-family="Arial">$</text></svg></sc-if>
<sc-if value="{{ isSales }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="sales gas meter" width="100%" height="100%" viewBox="0 0 40 40"><path d="M 13 32 C 5 26 7 17 13 11 C 12 17 16 18 17 15 C 22 19 23 27 17 32 Z" fill="#E2662B"></path><text x="30" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#B04A17" font-family="Arial">$</text></svg></sc-if>
<sc-if value="{{ isWater }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="water disposal pump" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><path d="M 14 5 C 14 5 6 15 6 21 a 8 8 0 0 0 16 0 c 0 -6 -8 -16 -8 -16 Z" fill="#8C9BA8" stroke="none"></path><circle cx="29" cy="27" r="7"></circle><path d="M 29 27 L 33 23 M 24 34 L 34 34"></path></svg></sc-if>
<sc-if value="{{ isFlare }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="flare" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><path d="M 20 36 L 20 20 M 14 36 L 26 36"></path><path d="M 20 4 C 14 11 13 15 16 19 C 17 15 19 15 20 13 C 24 16 25 19 22 22 C 27 19 27 11 20 4 Z" fill="#E2662B" stroke="none"></path></svg></sc-if>
<sc-if value="{{ isSko }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="sand knockouts" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><path d="M 8 8 L 32 8 L 22 22 L 22 32 L 18 32 L 18 22 Z"></path><circle cx="15" cy="13" r="1.2" fill="#4A6378"></circle><circle cx="21" cy="12" r="1.2" fill="#4A6378"></circle><circle cx="25" cy="15" r="1.2" fill="#4A6378"></circle></svg></sc-if>
<sc-if value="{{ isFrac }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="frac tanks" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2"><rect x="5" y="10" width="30" height="8" rx="2"></rect><rect x="5" y="22" width="30" height="8" rx="2"></rect></svg></sc-if>
<sc-if value="{{ isRoad }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="lease road entrance" width="100%" height="100%" viewBox="0 0 40 40" style="fill: none; stroke: #4A6378; stroke-width: 2.6; stroke-linecap: round"><path d="M 13 6 Q 4 20 13 34 M 27 6 Q 36 20 27 34"></path></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["wellhead","battery","separator","esp","lact","sales","water","flare","sko","frac","road"],"default":"wellhead"},"size":{"editor":null,"tsType":"string"},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind || 'wellhead', s = parseInt(this.props.size || '48', 10);
    return { px: s + 'px', isWellhead: k === 'wellhead', isBattery: k === 'battery', isSeparator: k === 'separator', isEsp: k === 'esp', isLact: k === 'lact', isSales: k === 'sales', isWater: k === 'water', isFlare: k === 'flare', isSko: k === 'sko', isFrac: k === 'frac', isRoad: k === 'road' };
  }
}
</script>
</body>
</html>

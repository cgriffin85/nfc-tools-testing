<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field JSA">
<meta name="theme-color" content="#43424B">
<title>Field JSA · test build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIG BLOCK — everything entity-specific lives here.
   This is a de-branded TEST BUILD. No company names, no real people,
   no real locations. Hazard and step content below is a starting set
   for the tester to replace — it is NOT an approved hazard library.
   ===================================================================== */
var CONFIG = {
  appName: 'Field JSA',
  storageKey: 'fieldjsa-test-v1',
  shiftStart: { day: '06:00', night: '18:00' },
  workTypes: ['Toe Prep', 'Frac', 'Drillout', 'Flowback', 'Well Test', 'Production'],
  changes: [
    { id: 'none',   label: 'Nothing changed' },
    { id: 'wx',     label: 'Weather / wind' },
    { id: 'press',  label: 'Pressure or rate change' },
    { id: 'rig',    label: 'Rigging up or down' },
    { id: 'equip',  label: 'New or swapped equipment' },
    { id: 'crew',   label: 'New person on crew' },
    { id: 'cust',   label: 'New customer instructions' },
    { id: 'simops', label: 'Other contractors on location' }
  ],
  /* Hazards that appear when a change is picked (marked NEW TODAY) */
  changeHazards: {
    wx:     { name: 'Wind or weather change', control: 'Secure loose items. Re-check which side is upwind before dumps, gauging and venting.' },
    press:  { name: 'Unexpected pressure or rate swing', control: 'Watch gauges closely; agree the limit that triggers a call to the supervisor and the customer.' },
    rig:    { name: 'Struck-by or pinch points during rig up / rig down', control: 'One person directs; nobody under a suspended load; stop-work if anyone is in the line of fire.' },
    equip:  { name: 'New or swapped equipment not yet proven', control: 'Pressure test before use; check ratings match the job; walk the new connections with the crew.' },
    crew:   { name: 'Inexperienced person on location', control: 'Stays within sight of a named mentor; does not break connections or work pressure alone.' },
    cust:   { name: 'Plan changed by the customer', control: 'Read the new instructions back to the customer rep and the crew before acting on them.' },
    simops: { name: 'Other contractors working on location', control: 'Know who is here and what they are doing; agree traffic routes and who has the pad when.' }
  },
  /* Starting hazard library — the tester should replace this */
  /* step: which starting task step (0-based) the hazard is seeded under; 'all' = whole location (offered as a chip) */
  library: [
    { name: 'Missed information at shift change', control: 'Walk the location together. The outgoing lead names anything abnormal before leaving.', step: 0 },
    { name: 'High-pressure release at a connection', control: 'Stay out of the line of fire. Confirm the line is bled to zero before breaking any connection. Restraints in place.', step: 1 },
    { name: 'Erosion / washout of iron or chokes from sand', control: 'Check chokes on a set interval and log sand. Back-up choke staged.', step: 2 },
    { name: 'H2S exposure', control: 'Personal H2S monitor on. Work from the upwind side. Second person watching on dumps and gauging.', step: 3 },
    { name: 'Fall from stairs, catwalk or tank top', control: 'Three points of contact. Handrails checked. No climbing with hands full.', step: 4 },
    { name: 'Vapors at the thief hatch', control: 'Stand upwind. Gas monitor on. Open the hatch slowly.', step: 4 },
    { name: 'Vehicle traffic on the pad', control: 'Spotter when backing. Park facing out. Agreed traffic route.', step: 'all' },
    { name: 'Heat or cold stress', control: 'Water and breaks scheduled. Watch each other for symptoms.', step: 'all' },
    { name: 'Slips and trips on the pad', control: 'Housekeeping on hoses and iron. Lighting at night.', step: 'all' }
  ],
  /* Starting task steps by work type — the tester should replace these */
  stepTemplates: {
    'Flowback': [
      'Shift change: walk the location with the outgoing lead',
      'Check iron, connections and pressure ratings on the manifold',
      'Monitor flowback: choke checks, readings every hour',
      'Dump the sand trap and watch the separator',
      'Gauge tanks and transfer fluid'
    ],
    '_default': [
      'Shift change: walk the location with the outgoing lead',
      'Check equipment, connections and pressure ratings',
      'Perform today’s work',
      'Monitor and record readings',
      'Housekeeping and handover'
    ]
  },
  ppe: ['FR clothing', 'Hard hat', 'Safety glasses', 'Personal H2S monitor', 'Gloves', 'Steel-toe boots', 'Hearing protection', 'Face shield'],
  ppeDefault: ['FR clothing', 'Hard hat', 'Safety glasses', 'Personal H2S monitor', 'Gloves', 'Steel-toe boots'],
  colors: {
    charcoal: '#43424B', charcoal2: '#54525E', charcoal3: '#635F6D',
    ground: '#F2F0ED', card: '#FFFFFF', rule: '#D8D6D2', ruleSoft: '#EDEBE7',
    ink: '#1A1A1A', ink2: '#54535A', ink3: '#83828A',
    ok: '#245C1A', okSoft: '#EAF0E8', okRule: '#C9DBC4',
    warn: '#8A5D00', warnSoft: '#FBF2E0', warnRule: '#E8CF9C',
    visitor: '#2E5C8A', visitorSoft: '#E8EEF6'
  }
};
</script>
<style>
:root{
  --charcoal:#43424B;--charcoal2:#54525E;--charcoal3:#635F6D;
  --ground:#F2F0ED;--card:#FFF;--rule:#D8D6D2;--rule-soft:#EDEBE7;
  --ink:#1A1A1A;--ink2:#54535A;--ink3:#83828A;
  --ok:#245C1A;--ok-soft:#EAF0E8;--ok-rule:#C9DBC4;
  --warn:#8A5D00;--warn-soft:#FBF2E0;--warn-rule:#E8CF9C;
  --vis:#2E5C8A;--vis-soft:#E8EEF6;
  --r-card:17px;--r-field:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E4E1DB;color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--ground);position:relative;display:flex;flex-direction:column}
.hdr{background:var(--charcoal);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px 12px;position:sticky;top:0;z-index:5}
.hdr-row{display:flex;align-items:center;gap:8px;min-height:44px}
.hdr-title{flex:1;min-width:0}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase}
.hdr .eyebrow{color:#D6D4DA}
.h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;line-height:1.15}
.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 9px;letter-spacing:.4px}
.pill-test{background:#F2CC4E;color:#1A1A1A}
.iconbtn{width:44px;height:44px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;padding:0;border-radius:999px;flex:none}
.roles{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--charcoal2);margin-top:10px}
.roles button{flex:1;height:44px;border:0;border-radius:999px;background:transparent;color:#E4E2E8;font-weight:600;font-size:15px}
.roles button.on{background:#fff;color:var(--ink)}
.segs{display:grid;gap:4px;margin-top:10px}
.seg{height:5px;border-radius:999px;background:var(--charcoal3)}
.seg.done{background:#7FC06F}.seg.cur{background:#fff}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.body{flex:1;padding:14px 12px 130px;display:flex;flex-direction:column;gap:12px}
.lead{color:var(--ink2);font-size:15px}
.card{border-radius:var(--r-card);background:var(--card);border:1px solid var(--rule)}
.card.pad{padding:14px 16px}
.card.ok{border-color:var(--ok-rule)}
.card.needs{border:2px solid var(--charcoal)}
.list > *{border-bottom:1px solid var(--rule-soft)}
.list > *:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;background:none;border:0;text-align:left;min-height:56px}
.row .grow{flex:1;min-width:0}
.k{font-size:12.5px;color:var(--ink3);font-weight:600}
.v{font-weight:600;font-size:15.5px}
.sub{color:var(--ink3);font-size:13px}
.label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);padding:4px 4px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink2);font-weight:600}
.inp{width:100%;min-height:48px;border-radius:var(--r-field);border:1px solid var(--rule);background:#fff;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--charcoal)}
textarea.inp{resize:vertical;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;background:#fff;color:var(--ink);border:1px solid var(--rule)}
.chip.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.chip.sm{min-height:44px;font-size:14.5px;padding:0 12px}
.btn{height:52px;border-radius:999px;border:0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-decoration:none}
.btn-dark{background:var(--charcoal);color:#fff}
.btn-black{background:#1A1A1A;color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-vis{background:var(--vis);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--rule)}
.btn-outline{background:#fff;color:var(--ink);border:2px solid var(--charcoal)}
.btn-dash{background:#F8F7F5;color:var(--ink);border:1px dashed #A9A7AE;height:46px;font-weight:600;font-size:15px}
.btn-off{background:#DCDAD6;color:var(--ink3)}
.btn-sm{height:44px;font-size:14.5px;padding:0 14px}
.linkbtn{border:0;background:none;color:var(--warn);font-weight:700;min-height:44px}
.linkbtn.quiet{color:var(--ink3);font-weight:600}
.footer{position:sticky;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(242,240,237,0),var(--ground) 28%);display:flex;flex-direction:column;gap:6px;z-index:4}
.footer.solid{background:#fff;border-top:1px solid var(--rule)}
.box{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #C9C7CD}
.box.on{background:var(--ok);border-color:var(--ok)}
.av{width:36px;height:36px;border-radius:50%;background:var(--charcoal3);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.av.sq{border-radius:10px;background:var(--vis-soft);color:var(--vis)}
.st{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;flex:none;white-space:nowrap}
.st-ok{color:var(--ok);background:var(--ok-soft)}
.st-warn{color:var(--warn);background:var(--warn-soft)}
.st-none{color:var(--ink2);background:var(--rule-soft)}
.banner{border-radius:var(--r-card);padding:14px 16px;display:flex;gap:12px;align-items:center}
.banner.ok{background:var(--ok-soft);border:1px solid var(--ok-rule);color:var(--ok)}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn-rule)}
.newtag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px}
.hz-head{display:flex;align-items:center;gap:8px}
.stephead{display:flex;align-items:center;gap:10px;padding:10px 4px 0;font-weight:700;font-size:15.5px}
.stephead .stepnum{width:26px;height:26px;border-radius:8px;background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.stephead.none .stepnum{background:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;max-width:300px;margin:0 auto}
.compass .chip{padding:0;min-height:48px;font-size:16px}
.compass .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);line-height:1.2;text-align:center}
.compass .mid b{font-size:17px;color:var(--ink)}
.padmap{width:100%;height:auto;display:block;touch-action:manipulation}
.radio{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid #C9C7CD}
.radio.on{border:7px solid var(--charcoal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;z-index:20;max-width:360px;text-align:center}
.empty{text-align:center;color:var(--ink2);padding:28px 16px}
.risk{display:inline-flex;align-items:center;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;flex:none}
.risk-high{color:#fff;background:#8B0000}.risk-med{color:#5C3E00;background:#F2CC4E}.risk-low{color:var(--ok);background:var(--ok-soft)}
.rk{flex:1;min-height:44px;border-radius:999px;font-weight:700;font-size:15px;background:#fff;border:1px solid var(--rule);color:var(--ink2)}
.rk.on.high{background:#8B0000;border-color:#8B0000;color:#fff}.rk.on.med{background:#F2CC4E;border-color:#C9A227;color:#3A2A00}.rk.on.low{background:var(--ok);border-color:var(--ok);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted-note{font-size:12.5px;color:var(--ink3);padding:0 4px}
@media (max-width:360px){.h1{font-size:21px}.roles button{font-size:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* ---------- storage (local to this phone) ---------- */
  var mem = { jsas: [], notes: '', sites: {} };
  function load() {
    try { var raw = localStorage.getItem(CONFIG.storageKey); if (raw) mem = JSON.parse(raw); } catch (e) {}
    if (!mem.jsas) mem.jsas = [];
    if (typeof mem.notes !== 'string') mem.notes = '';
    if (!mem.sites || typeof mem.sites !== 'object') mem.sites = {};
    /* before FJ-006 muster points were a typed list: old JSAs get an empty map and lose the list */
    mem.jsas.forEach(function (j) { if (!j.site) return; if (!j.site.map) j.site.map = { rot: 0, marks: [] }; if (j.site.musters) delete j.site.musters; });
    /* before FJ-007 there was no PPE confirmation: a signed JSA counts as confirmed, a draft must tick it */
    mem.jsas.forEach(function (j) { if (j.site && typeof j.site.ppeOk !== 'boolean') j.site.ppeOk = !!j.signedAt; });
    /* wind typed as text before FJ-005: keep it if it names one of the eight directions */
    mem.jsas.forEach(function (j) { if (j.site && j.site.windDir) { var w = String(j.site.windDir).trim().toUpperCase(); if (DIRS.indexOf(w) >= 0) j.site.windDir = w; } });
  }
  function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(mem)); } catch (e) {} }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function clock(ts) { var d = new Date(ts), h = d.getHours(); return (h % 12 || 12) + ':' + pad(d.getMinutes()) + (h >= 12 ? ' PM' : ' AM'); }
  function niceDate(iso) { if (!iso) return ''; var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function initials(name) { return String(name || '?').trim().split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase() || '?'; }
  var ICON = {
    back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    bigcheck: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    shield: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#245C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
    note: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/></svg>',
    chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  function box(on) { return '<span class="box' + (on ? ' on' : '') + '">' + (on ? ICON.check : '') + '</span>'; }
  function stChip(kind, text) { return '<span class="st st-' + kind + '">' + esc(text) + '</span>'; }

  /* ---------- UI state (not saved) ---------- */
  var ui = { role: 'lead', view: 'home', id: null, step: 0, crewId: null, crewOk: {}, concernOpen: false, concern: '', commentFor: null, comment: '', vis: null, visDone: false, ppeNew: '', reviseWhy: '', reviseTags: {}, mapTool: '', mapSel: '', signOk: false };
  var toastTimer = null;
  function toast(msg) {
    var old = document.getElementById('toast'); if (old) old.parentNode.removeChild(old);
    var t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }

  function cur() { for (var i = 0; i < mem.jsas.length; i++) if (mem.jsas[i].id === ui.id) return mem.jsas[i]; return null; }

  /* ---------- model ---------- */
  function newJsa() {
    var prev = mem.jsas.filter(function (j) { return j.signedAt; }).slice(-1)[0];
    var j = {
      id: uid(), created: Date.now(), signedAt: null,
      basics: {
        customer: prev ? prev.basics.customer : '[Customer]',
        location: prev ? prev.basics.location : 'Pad A · Well 2H',
        gps: prev ? prev.basics.gps : '00.0000, −00.0000',
        date: today(), shift: 'day',
        workType: prev ? prev.basics.workType : 'Flowback',
        hospital: prev ? prev.basics.hospital : '[Nearest hospital], [City]',
        lead: prev ? prev.basics.lead : '',
        supervisor: prev ? prev.basics.supervisor : ''
      },
      crew: prev ? prev.crew.map(function (c) { return { id: c.id, name: c.name, role: c.role, trainee: c.trainee, here: true }; }) : [],
      mentoring: { topic: '', why: '' },
      handoff: { status: '', instructions: '', plan: '' },
      changes: [], steps: [], stepsSeeded: false, hazards: [], hzSeeded: false,
      site: { windDir: '', windMph: '', map: null, muster: '', ppe: CONFIG.ppeDefault.slice(), ppeOk: false },
      accepts: {}, concerns: [], visitors: [], comments: [], prevId: prev ? prev.id : null, rev: 0, revisions: []
    };
    mem.jsas.push(j); save();
    return j;
  }
  function leadMember(j) { return { id: 'lead', name: j.basics.lead || 'Shift lead', role: 'Shift lead', here: true }; }
  function people(j) { return [leadMember(j)].concat(j.crew.filter(function (c) { return c.here !== false; })); }
  function personName(j, id) { var p = people(j).filter(function (x) { return x.id === id; })[0]; return p ? p.name : '—'; }
  function prevOf(j) { if (!j.prevId) return null; return mem.jsas.filter(function (x) { return x.id === j.prevId; })[0] || null; }

  function seedSteps(j) {
    if (j.stepsSeeded) return;
    var p = prevOf(j);
    var src = (p && p.basics.workType === j.basics.workType && p.steps.length) ? p.steps.map(function (s) { return s.text; }) : (CONFIG.stepTemplates[j.basics.workType] || CONFIG.stepTemplates._default);
    j.steps = src.map(function (t) { return { id: uid(), text: t, ok: false }; });
    j.stepsSeeded = true; save();
  }
  function seedHazards(j) {
    var p = prevOf(j);
    if (!j.hzSeeded) {
      var base;
      if (p && p.basics.workType === j.basics.workType && p.hazards.length) {
        /* carried forward: under the new step with the same text, else whole location */
        base = p.hazards.filter(function (h) { return !h.change; }).map(function (h) {
          var ps = p.steps.filter(function (x) { return x.id === h.step; })[0];
          var ns = ps ? j.steps.filter(function (x) { return x.text === ps.text; })[0] : null;
          return { name: h.name, control: h.control, owner: validOwner(j, h.owner), risk: h.risk || '', step: ns ? ns.id : 'all' };
        });
      } else {
        base = CONFIG.library.filter(function (h) { return h.step !== 'all'; }).map(function (h) { var st = j.steps[h.step]; return { name: h.name, control: h.control, owner: 'lead', step: st ? st.id : 'all' }; });
      }

  /* =====================================================================
     EVENTS (delegated — no inline handlers)
     ===================================================================== */
  function setPath(j, path, val) {
    var seg = path.split('.'), o = j;
    for (var i = 0; i < seg.length - 1; i++) {
      var k = seg[i];
      if (Array.isArray(o)) { o = o.filter(function (x) { return x.id === k; })[0]; }
      else o = o[k];
      if (!o) return;
    }
    var last = seg[seg.length - 1];
    if (Array.isArray(o)) return;
    o[last] = val;
  }

  app.addEventListener('input', function (e) {
    var t = e.target;
    var b = t.getAttribute('data-bind');
    if (b) {
      var j = cur(); if (!j) return;
      setPath(j, b, t.value); if (b.indexOf('site.map.') === 0) syncSite(j); save();
      softRefreshFooter();
      return;
    }
    var u = t.getAttribute('data-ui');
    if (u === 'notes') { mem.notes = t.value; save(); return; }
    if (u === 'concern') { ui.concern = t.value; return; }
    if (u === 'ppeNew') { ui.ppeNew = t.value; return; }
    if (u === 'reviseWhy') { ui.reviseWhy = t.value; return; }
    if (u === 'comment') { ui.comment = t.value; return; }
    if (u && u.indexOf('vis.') === 0) { ui.vis[u.slice(4)] = t.value; softRefreshFooter(); return; }
  });
  app.addEventListener('change', function (e) {
    var t = e.target, b = t.getAttribute('data-bind');
    if (b && t.tagName === 'SELECT') { var j = cur(); if (j) { setPath(j, b, t.value); save(); render(); } }
    if (b && b.indexOf('site.map.') === 0) render();   /* a marker's new name shows on the map and in the muster list */

      case 'sample': loadSample(); ui.view = 'home'; toast('Example loaded'); return;
      case 'open': ui.id = id; j = cur(); if (j.signedAt) { ui.view = 'detail'; } else { ui.view = 'wizard'; ui.step = (j.revisions && j.revisions.length) ? 3 : 0; } window.scrollTo(0, 0); break;
      case 'wiz-back': ui.mapTool = ''; ui.mapSel = ''; if (ui.step > 0) ui.step--; else ui.view = 'home'; window.scrollTo(0, 0); break;
      case 'wiz-next':
        if (!stepReady(j, ui.step)) { toast(stepBlock(j, ui.step)); return; }
        if (ui.step === 7) { j.signedAt = Date.now(); save(); ui.view = 'detail'; window.scrollTo(0, 0); break; }
        ui.step++; ui.mapTool = ''; ui.mapSel = '';
        if (ui.step === 7) ui.signOk = false;   /* the lead signs on purpose, every time */
        if (ui.step === 4) seedSteps(j);
        if (ui.step === 5) seedHazards(j);
        window.scrollTo(0, 0); break;
      case 'worktype':
        if (id === j.basics.workType) break;
        if ((j.stepsSeeded || j.hzSeeded) && el.getAttribute('data-armed') !== '1') { el.setAttribute('data-armed', '1'); toast('Changing work type resets your steps and hazards. Tap it again to change.'); return; }
        j.basics.workType = id; j.stepsSeeded = false; j.hzSeeded = false; j.steps = []; j.hazards = []; save(); break;
      case 'crew-add': j.crew.push({ id: uid(), name: '', role: 'Operator', trainee: false, here: true }); save(); break;
      case 'crew-del': if (!armed(el, 'Tap again to remove this person')) return; j.crew = j.crew.filter(function (c) { return c.id !== id; }); j.hazards.forEach(function (z) { if (z.owner === id) z.owner = 'lead'; }); save(); break;
      case 'crew-trainee': j.crew.forEach(function (c) { if (c.id === id) c.trainee = !c.trainee; }); save(); break;
      case 'crew-here': j.crew.forEach(function (c) { if (c.id === id) c.here = c.here === false; }); j.hazards.forEach(function (z) { z.owner = validOwner(j, z.owner); }); save(); break;
      case 'change':
        if (id === 'none') j.changes = j.changes.indexOf('none') >= 0 ? [] : ['none'];
        else { j.changes = j.changes.filter(function (c) { return c !== 'none'; }); var k = j.changes.indexOf(id); if (k >= 0) j.changes.splice(k, 1); else j.changes.push(id); }
        save(); break;
      case 'step-ok': j.steps.forEach(function (s) { if (s.id === id) s.ok = !s.ok; }); save(); break;
      case 'step-del': if (!armed(el, 'Tap again to remove this step')) return; j.steps = j.steps.filter(function (s) { return s.id !== id; }); j.hazards.forEach(function (z) { if (z.step === id) z.step = 'all'; }); save(); break;
      case 'step-add': j.steps.push({ id: uid(), text: '', ok: false }); save(); render(); var ins = app.querySelectorAll('[data-bind^="steps."]'); if (ins.length) ins[ins.length - 1].focus(); return;
      case 'hz-ok': var hzz = j.hazards.filter(function (z) { return z.id === id; })[0]; if (hzz && !hzz.ok && !hzz.risk) { toast('Set the risk first: High, Medium or Low'); return; } if (hzz) hzz.ok = !hzz.ok; save(); break;
      case 'hz-risk': j.hazards.forEach(function (z) { if (z.id === id) z.risk = el.getAttribute('data-r'); }); save(); break;
      case 'revise-open': ui.view = 'revise'; ui.reviseWhy = ''; ui.reviseTags = {}; window.scrollTo(0, 0); break;
      case 'revise-tag': ui.reviseTags[id] = !ui.reviseTags[id]; break;
      case 'revise-go':
        if (!ui.reviseWhy.trim()) { toast('Write what changed first'); return; }
        j.revisions = j.revisions || [];
        j.rev = (j.rev || 0) + 1;
        j.revisions.push({ n: j.rev, at: Date.now(), why: ui.reviseWhy.trim(), prevSignedAt: j.signedAt });
        var tags = Object.keys(ui.reviseTags).filter(function (k) { return ui.reviseTags[k]; });
        j.changes = j.changes.filter(function (c) { return c !== 'none'; });
        tags.forEach(function (t) { if (j.changes.indexOf(t) < 0) j.changes.push(t); });
        if (!j.changes.length) j.changes = ['none'];
        j.signedAt = null; j.accepts = {};
        j.hazards.forEach(function (z) { z.ok = false; });
        j.site.ppeOk = false; ui.signOk = false;
        save(); ui.view = 'wizard'; ui.step = 3; window.scrollTo(0, 0); break;
      case 'hz-del': if (!armed(el, 'Tap again to remove this hazard')) return; j.hazards = j.hazards.filter(function (z) { return z.id !== id; }); save(); break;
      case 'hz-add': var nz = { id: uid(), step: id || 'all', name: '', control: '', owner: 'lead', risk: '', ok: false }; j.hazards.push(nz); save(); render(); var hz = app.querySelector('[data-bind="hazards.' + nz.id + '.name"]'); if (hz) hz.focus(); return;
      case 'hz-lib': var l = CONFIG.library.filter(function (x) { return x.name === id; })[0]; if (l) j.hazards.push({ id: uid(), step: 'all', name: l.name, control: l.control, owner: 'lead', risk: '', ok: false }); save(); break;
      case 'muster': j.site.muster = id; save(); break;
      case 'wind-dir': if (DIRS.indexOf(id) >= 0) { j.site.windDir = id; save(); } break;
      case 'map-rot': ensureMap(j); j.site.map.rot = ((j.site.map.rot || 0) + 45) % 360; syncSite(j); save(); break;
      case 'map-tool': ui.mapTool = ui.mapTool === id ? '' : id; ui.mapSel = ''; break;
      case 'map-sel': ui.mapSel = ui.mapSel === id ? '' : id; ui.mapTool = ''; break;
      case 'map-del':
        if (!armed(el, 'Tap again to remove it from the map')) return;
        j.site.map.marks = j.site.map.marks.filter(function (m) { return m.id !== id; }); if (j.site.muster === id) j.site.muster = '';
        ui.mapSel = ''; syncSite(j); save(); break;
      case 'map-tap':
        if (!ui.mapTool) { toast('Pick a marker below first, then tap the pad'); return; }
        ensureMap(j);
        var rr = el.getBoundingClientRect();
        var mx = ((e.clientX - rr.left) / rr.width * 340 - PAD.x) / PAD.w * 100, my = ((e.clientY - rr.top) / rr.height * 250 - PAD.y) / PAD.h * 100;
        if (mx < -3 || mx > 103 || my < -3 || my > 103) { toast('Tap inside the pad'); return; }
        mx = Math.min(100, Math.max(0, mx)); my = Math.min(100, Math.max(0, my));   /* a tap on the edge lands on it */
        var nm = { id: uid(), type: ui.mapTool, label: '', x: Math.round(mx), y: Math.round(my) };
        j.site.map.marks.push(nm);
        if (nm.type === 'muster' && !todayMuster(j)) j.site.muster = nm.id;
        ui.mapSel = nm.id; ui.mapTool = '';
        syncSite(j); save(); render(); var mk = app.querySelector('[data-bind="site.map.marks.' + nm.id + '.label"]'); if (mk) mk.focus(); return;
      case 'ppe': var pi = j.site.ppe.indexOf(id); if (pi >= 0) j.site.ppe.splice(pi, 1); else j.site.ppe.push(id); ppeChanged(j); save(); break;
      case 'ppe-add': var pf = app.querySelector('[data-ui="ppeNew"]'); var pv = pf && pf.value.trim(); if (pv && j.site.ppe.indexOf(pv) < 0) { j.site.ppe.push(pv); ppeChanged(j); save(); } ui.ppeNew = ''; break;
      case 'ppe-ok': j.site.ppeOk = !j.site.ppeOk; save(); break;
      case 'sign-ok': ui.signOk = !ui.signOk; break;
      case 'to-detail': ui.view = 'detail'; ui.concernOpen = false; break;
      case 'crew-open': ui.id = id; ui.crewId = el.getAttribute('data-crew'); ui.crewOk = {}; ui.concernOpen = false; ui.concern = ''; ui.view = 'crew'; window.scrollTo(0, 0); break;
      case 'crew-ok': if (!j.accepts[ui.crewId]) ui.crewOk[id] = !ui.crewOk[id]; break;
      case 'crew-accept':
        var mineH = j.hazards.filter(function (z) { return z.owner === ui.crewId; });
        if (!mineH.every(function (z) { return ui.crewOk[z.id]; })) { toast('Confirm your items first'); return; }
        j.accepts[ui.crewId] = Date.now(); save(); window.scrollTo(0, 0); break;
      case 'concern-open': ui.concernOpen = true; render(); var cf = app.querySelector('[data-ui="concern"]'); if (cf) cf.focus(); return;
      case 'concern-send':
        if (!ui.concern.trim()) { toast('Write the concern first'); return; }
        var me = j.crew.filter(function (c) { return c.id === ui.crewId; })[0];
        j.concerns.push({ by: me ? me.name : 'Crew', text: ui.concern.trim(), at: Date.now() }); ui.concern = ''; ui.concernOpen = false; save(); break;
      case 'vis-open': case 'vis-next': ui.vis = { company: '', name: '', role: '', ok: false }; ui.visDone = false; ui.view = 'visitor'; window.scrollTo(0, 0); break;
      case 'vis-ok': ui.vis.ok = !ui.vis.ok; break;
      case 'vis-sign':
        if (!(ui.vis.company.trim() && ui.vis.name.trim() && ui.vis.ok)) { toast('Fill in your company and name, and tick the box'); return; }
        j.visitors.push({ company: ui.vis.company.trim(), name: ui.vis.name.trim(), role: ui.vis.role.trim(), at: Date.now(), rev: j.rev || 0 }); save(); ui.visDone = true; window.scrollTo(0, 0); break;
      case 'vis-close': ui.view = 'detail'; window.scrollTo(0, 0); break;
      case 'review-open': ui.id = id; ui.commentFor = null; ui.view = 'review'; window.scrollTo(0, 0); break;
      case 'cmt-open': ui.commentFor = ui.commentFor === id ? null : id; ui.comment = ''; render(); var ci = app.querySelector('[data-ui="comment"]'); if (ci) ci.focus(); return;
      case 'cmt-send': if (!ui.comment.trim()) return; j.comments.push({ hazard: ui.commentFor, text: ui.comment.trim(), at: Date.now() }); ui.comment = ''; ui.commentFor = null; save(); break;
      case 'share-one': shareText('JSA ' + j.basics.location, jsaText(j)); return;
      case 'dl-one': download('JSA-' + j.basics.date + '-' + (j.basics.location || 'location').replace(/[^a-z0-9]+/gi, '-') + '.txt', jsaText(j)); return;
      case 'share-all': shareText('Field JSA test notes', allText()); return;
      case 'dl-all': download('field-jsa-test-' + today() + '.txt', allText()); return;
      case 'wipe':
        if (el.getAttribute('data-armed') !== '1') { el.setAttribute('data-armed', '1'); el.textContent = 'Tap again to clear everything'; return; }
        mem = { jsas: [], notes: '', sites: {} }; save(); ui.view = 'home'; toast('Cleared'); return;
    }
    render();
  });

  /* live countdown in the wizard header */
  setInterval(function () {
    if (ui.view !== 'wizard') return;
    var j = cur(); var el = app.querySelector('[data-countdown]');
    if (j && el) el.textContent = countdown(j);
  }, 1000);

  /* ---------- example ---------- */
  function loadSample() {
    var crew = [{ id: uid(), name: 'Crew A Example', role: 'Operator', trainee: false, here: true }, { id: uid(), name: 'Crew B Example', role: 'Operator (trainee)', trainee: true, here: true }];
    var steps = CONFIG.stepTemplates.Flowback.map(function (t) { return { id: uid(), text: t, ok: true }; });
    var j = {
      id: uid(), created: Date.now(), signedAt: Date.now() - 20 * 60000,
      basics: { customer: '[Example customer]', location: 'Pad A · Well 2H', gps: '00.0000, −00.0000', date: today(), shift: 'day', workType: 'Flowback', hospital: '[Nearest hospital], [City]', lead: 'Pat Example', supervisor: 'Morgan Example' },
      crew: crew, mentoring: { topic: 'Reading a choke', why: 'Runs chokes solo next hitch' },
      handoff: { status: 'Flowing on 18/64, 2,350 psi, ~85 bbl/hr, sand light', instructions: 'Hold the choke until the company man says otherwise. Report any swing over 200 psi.', plan: 'Keep flowing. Sand trap dumps every 2 hrs. Swap tank at ~80%.' },
      changes: ['wx', 'crew'], steps: steps, stepsSeeded: true, hzSeeded: true,
      hazards: [
        { id: uid(), step: 'all', name: CONFIG.changeHazards.wx.name, control: CONFIG.changeHazards.wx.control, owner: 'lead', risk: 'med', ok: true, change: 'wx' },
        { id: uid(), step: 'all', name: CONFIG.changeHazards.crew.name, control: CONFIG.changeHazards.crew.control, owner: 'lead', risk: 'med', ok: true, change: 'crew' },
        { id: uid(), step: steps[0].id, name: CONFIG.library[0].name, control: CONFIG.library[0].control, owner: 'lead', risk: 'low', ok: true },
        { id: uid(), step: steps[1].id, name: CONFIG.library[1].name, control: CONFIG.library[1].control, owner: 'lead', risk: 'high', ok: true },
        { id: uid(), step: steps[3].id, name: CONFIG.library[3].name, control: CONFIG.library[3].control, owner: crew[0].id, risk: 'high', ok: true },
        { id: uid(), step: steps[2].id, name: CONFIG.library[2].name, control: CONFIG.library[2].control, owner: crew[0].id, risk: 'med', ok: true },
        { id: uid(), step: steps[4].id, name: CONFIG.library[4].name, control: CONFIG.library[4].control, owner: crew[1].id, risk: 'low', ok: true }
      ],
      site: { windDir: 'SW', windMph: '18', map: { rot: 0, marks: [{ id: 'mA', type: 'muster', label: 'Lease road entrance', x: 8, y: 90 }, { id: 'mB', type: 'muster', label: 'Far fence line', x: 92, y: 8 }, { id: 'e1', type: 'entrance', label: 'Lease road', x: 4, y: 52 }, { id: 'w1', type: 'wellhead', label: '2H', x: 55, y: 40 }, { id: 't1', type: 'tanks', label: 'Frac tanks', x: 85, y: 75 }] }, mapLoaded: true, muster: 'mA', ppe: CONFIG.ppeDefault.slice(), ppeOk: true },
      accepts: {}, concerns: [], visitors: [], comments: [], prevId: null, rev: 0, revisions: []
    };
    j.accepts[crew[0].id] = Date.now() - 12 * 60000;
    if (!mem.sites[siteKey(j)]) syncSite(j);
    mem.jsas.push(j); save();
  }

  load();
  render();
})();
</script>
